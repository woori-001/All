<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통신사별 환수규정</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f5f8; --side:#ffffff; --card:#ffffff;
  --line:#dde3ec; --line2:#e9edf3; --tline:#dfe4ec; --thead:#c2d7f2;
  --tx:#1a1d23; --tx2:#4e5560; --tx3:#8b919c;
  --pri:#0d5bd4; --pri-w:#e7f0fd;
  --warn:#d63a31; --warn-w:#fef0ee;
  --r:10px;
  --sideW:222px; --topH:56px; --barH:0px;
  --mk:16px;   /* 들여쓰기 한 단계 = 마커칸 너비 */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
  font-size:14px; line-height:1.6; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}

/* ── 상단 ── */
.topbar{
  background:#fff;border-bottom:1px solid var(--line);position:fixed;top:0;left:0;right:0;
  height:var(--topH);z-index:60;display:flex;align-items:center;gap:12px;padding:0 20px
}
.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:6px;width:32px;height:32px;font-size:14px;line-height:1;color:var(--tx2)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden;flex:1}
.brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.tnotice{
  font-size:12.5px;font-weight:500;color:#4a5361;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-left:12px;border-left:1px solid var(--line);min-width:0
}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.srch{position:relative}
.srch input{
  width:250px;height:33px;padding:0 28px 0 31px;border:1px solid var(--line);
  border-radius:6px;background:#f7fafe;outline:none;color:var(--tx)
}
.srch input::placeholder{color:var(--tx3)}
.srch input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(13,91,212,.13)}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.srch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px}
.srch .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--tx3);font-size:15px;display:none;padding:2px 5px;line-height:1}
.btn{height:33px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--tx2);font-weight:500;white-space:nowrap}
.btn:hover{background:#f2f7fd;border-color:#c3d8f2;color:var(--tx)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#0a4bb0;color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* ── 사이드바 ── */
.side{
  position:fixed;top:calc(var(--topH) + var(--barH));bottom:0;left:0;width:var(--sideW);
  background:var(--side);border-right:1px solid var(--line);overflow-y:auto;z-index:55;padding:14px 10px 26px;
  display:flex;flex-direction:column
}
.side .gp{margin-bottom:2px;flex:none}
.gt{
  width:100%;display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left;
  padding:8px 10px;font-size:13.5px;font-weight:600;color:var(--tx2);border-radius:6px;letter-spacing:-.01em
}
.gt:hover{background:#eff4fb;color:var(--tx)}
.gt .ci{width:17px;height:17px;flex:none;display:block}
.gt .ci svg{display:block;width:17px;height:17px}
.gt .arw{margin-left:auto;color:#c3c6cc;font-size:10px;transition:transform .15s}
.gp.open .gt{color:var(--tx)}
.gp.open .gt .arw{transform:rotate(90deg)}
.subs{display:none;padding:2px 0 8px}
.gp.open .subs{display:block}
.sb{
  width:100%;border:0;background:none;text-align:left;padding:6px 10px 6px 36px;
  font-size:13px;color:var(--tx2);border-radius:6px
}
.sb:hover{background:#eff4fb;color:var(--tx)}
.sb.on{color:#0a4bb0;font-weight:700;background:var(--pri-w)}
.sideBk{display:none;position:fixed;inset:0;background:rgba(20,22,26,.35);z-index:54}
.sidever{
  margin:26px 4px 0;flex:none;padding:12px 8px 0;border-top:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:flex-start;gap:5px
}
.side .sidever{margin-top:auto}
.sidever .vb{
  font-size:11.5px;font-weight:700;color:#0a4bb0;background:var(--pri-w);
  border:1px solid #cfe0f8;border-radius:5px;padding:3px 9px;letter-spacing:-.01em
}
.sidever .vu{font-size:11px;color:var(--tx3);padding-left:2px;letter-spacing:-.01em}

/* ── 본문 ── */
.body{margin-left:var(--sideW);padding:calc(var(--topH) + var(--barH) + 26px) 32px 80px;max-width:1520px}
.crumb{font-size:15px;font-weight:600;color:#39414e;margin-bottom:22px;display:flex;align-items:center;min-height:32px}
.crumb b{color:var(--tx);font-weight:700;font-size:17.5px;letter-spacing:-.02em}
.crumb .sep{margin:0 11px;color:#b9c2cf;font-size:14px;font-weight:400}
.clogo{display:block;object-fit:contain;flex:none;-webkit-user-drag:none;user-select:none}
.clogo.mini{display:inline-block;vertical-align:middle;margin-right:8px}
.seclab .cnt{color:var(--tx3);font-weight:500;font-size:12px}

/* 핵심 요약 */
.keys{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px;align-items:stretch}
.keys > .key{
  background:#e9f1fd;border:1px solid #c8dcf7;border-radius:var(--r);
  padding:14px 20px;min-width:190px;display:flex;flex-direction:column;justify-content:center
}
.keys > .key .k{font-size:13px;color:#31537f;font-weight:700;letter-spacing:-.01em}
.keys > .key .v{font-size:18px;font-weight:800;margin-top:5px;color:#0f3a7d;letter-spacing:-.03em;line-height:1.35}

.seclab{
  font-size:13px;font-weight:700;color:var(--tx2);
  margin:34px 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:2px
}
.seclab:first-child{margin-top:0}

/* ── 카드 ── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:16px;overflow:hidden
}
.card > h3{
  margin:0;padding:14px 18px 11px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  color:var(--tx);display:flex;align-items:center;gap:9px;background:none;border:0
}
.card > h3 .dot{display:none}
.card > h3 .tag{margin-left:auto;font-size:11px;font-weight:600;color:#2f5f9e;background:#e6eefb;border-radius:5px;padding:3px 9px}
.card > h3 .gtag{font-size:11px;font-weight:700;border-radius:5px;padding:3px 9px;border:0;letter-spacing:-.01em}
.card .bd{padding:0 0 4px}
.card .bd.pad{padding:0 18px 17px}

/* 그룹 (소분류) */
.gtabs{display:flex;gap:6px;margin:0 0 20px;flex-wrap:wrap;align-items:center}
.gt2{
  border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 13px;
  font-size:13px;font-weight:500;color:var(--tx2);display:inline-flex;align-items:center;gap:7px
}
.gt2:hover{background:#f2f7fd;border-color:#c3d8f2;color:var(--tx)}
.gt2.on{color:#fff;background:var(--tx);border-color:var(--tx)}
.gt2 .gd{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none}
.ggrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 16px;align-items:start}
.gcol{
  min-width:0;background:color-mix(in srgb, var(--gc) 10%, #fff);
  border-radius:12px;padding:14px 14px 2px
}
.ghead{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  color:color-mix(in srgb, var(--gc) 88%, #1a1d23);
  background:color-mix(in srgb, var(--gc) 22%, #fff);
  border-radius:6px;padding:5px 11px;margin-bottom:13px
}
.ghead .gd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--gc)}
.gone{padding:0}

/* 카드 그리드 */
.grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 16px;align-items:start}
.grid .col{min-width:0}

/* ── 환수율 표 : 선 없이 정렬로 구분 ── */
table.rt2{width:100%;border-collapse:collapse;font-size:13.2px}
table.rt2 th,table.rt2 td{text-align:left;padding:10px 10px;vertical-align:top}
table.rt2 tr > *:first-child{padding-left:18px}
table.rt2 tr > *:last-child{padding-right:18px}
table.rt2 thead th{
  font-size:11.5px;font-weight:700;color:#5f6a79;background:#fff;
  padding-top:8px;padding-bottom:8px;
  border-top:1px solid var(--line2);border-bottom:1.5px solid #c8d2e0;
  white-space:nowrap;letter-spacing:.02em
}
table.rt2 tbody td{border-bottom:1px solid var(--tline)}
table.rt2 tbody tr:last-child td{border-bottom:0}
table.rt2 tbody tr:hover td{background:#f6faff}
table.rt2 th.k,table.rt2 td.key{width:1%;min-width:118px}
table.rt2 th.k.nw,table.rt2 td.key.nw{white-space:nowrap}
table.rt2 td.key{font-weight:600;color:var(--tx);word-break:keep-all;padding-right:22px}
table.rt2 td.key.nb{border-bottom-color:transparent}
table.rt2 td.key.mg{color:transparent}
table.rt2 td.sec{color:var(--tx);word-break:keep-all;overflow-wrap:break-word;font-variant-numeric:tabular-nums}
table.rt2 td.sec .memo{display:block;font-size:11.5px;color:#767d88;margin-top:2px;line-height:1.45}
table.rt2 td.sec .memo.m-red{color:#c0392b;font-weight:600}
table.rt2 td.sec .memo.m-blue{color:#1d6fc4;font-weight:600}
table.rt2 td.sec .dv{color:#c8ccd3;margin:0 6px}
table.rt2 td.sec .dash{color:#ccd0d6}
table.rt2 th.val,table.rt2 td.val{width:1%;white-space:nowrap;text-align:right}
.num{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-block;min-width:42px;text-align:right;letter-spacing:-.02em}
.num.txt{min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap}
.r3{color:var(--warn)}
.r2{color:#b5651d}
.r1{color:var(--tx)}
.r0{color:var(--tx2)}

/* ── 기준표 ── */
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th,table.t td{
  padding:10px 10px;text-align:left;vertical-align:top;line-height:1.55;
  border-bottom:1px solid var(--tline)
}
table.t tr > *:first-child{padding-left:18px}
table.t tr > *:last-child{padding-right:18px}
table.t thead th{
  font-size:11.5px;font-weight:700;color:#5f6a79;background:#fff;
  padding-top:8px;padding-bottom:8px;white-space:nowrap;
  border-top:1px solid var(--line2);border-bottom:1.5px solid #c8d2e0;letter-spacing:.02em
}
table.t tbody tr:last-child > td{border-bottom:0}
table.t tbody td:first-child{font-weight:600;color:var(--tx);white-space:pre-wrap;padding-right:20px}
table.t tbody tr:hover td{background:#f6faff}
table.t td.w{white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word}
table.t tbody td.nb{border-bottom-color:transparent}
table.t tbody td.mg{color:transparent}
.tblwrap{overflow-x:auto}

/* ── 정책 ── */
.pol{padding:14px 0;border-top:1px solid var(--tline)}
.pol:first-child{padding-top:2px;border-top:0}
.pol .st{font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--tx);word-break:keep-all;overflow-wrap:break-word}
.pol .st.hm{padding-left:var(--mk);text-indent:calc(-1 * var(--mk))}
.pol .st .mk{font-style:normal;display:inline-block;width:var(--mk);color:var(--pri);font-weight:700;text-indent:0}
.pol .ct{font-size:13px;color:#3f4650;word-break:keep-all;overflow-wrap:break-word}
.pol .ct.ind{margin-left:var(--mk)}
.pol.hi{background:var(--warn-w);border-radius:8px;padding:13px 15px;margin:9px 0;border:0}
.pol.hi .st{color:var(--warn)}
.pol.hi .ct{color:#8f4a44}

/* 계층 텍스트 */
/* 들여쓰기 격자 : 마커칸 = 단계폭 = --mk. 모든 단계가 같은 눈금 위에 놓임 */
.tx .l0,.tx .l1,.tx .l2,.tx .l3{
  word-break:keep-all;overflow-wrap:break-word;
  padding-left:var(--mk);text-indent:calc(-1 * var(--mk))
}
.tx .l0{font-weight:700;color:var(--tx);margin:15px 0 6px}
.tx .l1{font-weight:600;color:var(--tx);margin:10px 0 3px}
.tx .l2{margin:2px 0;color:#3f4650}
.tx .l2.note,.tx .l2.arw{color:var(--tx3)}
.tx .l3{margin:2px 0;text-indent:0}
.tx > *:first-child{margin-top:0 !important}
.tx .mk{
  font-style:normal;display:inline-block;width:var(--mk);color:#aab1bc;font-weight:600;
  text-indent:0;white-space:nowrap
}
.tx .l0 > .mk{color:var(--pri)}
.tx .l1 > .mk{color:var(--pri);font-size:10px;vertical-align:1.5px}
.tx .sp{height:9px;padding-left:0;text-indent:0}

.empty{text-align:center;color:var(--tx3);padding:56px 0;font-size:13.5px}
.ft{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--tx3);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 18px}
mark{background:#fff0a6;color:inherit;padding:0 1px;border-radius:2px}

/* ── 모달 ── */
.mask{position:fixed;inset:0;background:rgba(20,22,26,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:350px;padding:24px;box-shadow:0 16px 44px rgba(20,22,26,.18)}
.modal h4{margin:0 0 4px;font-size:16px;font-weight:700}
.modal p{margin:0 0 16px;font-size:12.5px;color:var(--tx3)}
.modal input{width:100%;height:37px;padding:0 12px;border:1px solid var(--line);border-radius:6px;outline:none}
.modal input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(13,91,212,.13)}
.modal .row{display:flex;gap:8px;margin-top:14px}
.modal .row .btn{flex:1;height:37px}
.err{color:var(--warn);font-size:12.5px;margin-top:8px;min-height:17px}

/* ── 편집 모드 ── */
.ebar{
  position:fixed;top:var(--topH);left:0;right:0;height:44px;z-index:58;display:none;
  align-items:center;gap:10px;padding:0 20px;background:var(--pri);color:#fff
}
body.edit .ebar{display:flex}
body.edit{--barH:44px}
.ebar .etag{font-weight:700;font-size:13px}
.ebar .eh{font-size:12.5px;color:#d3e3f8}
.ebar .demo{font-size:11.5px;font-weight:700;color:#7a4a00;background:#ffe8bf;border-radius:4px;padding:3px 9px}
.ebar .sp{margin-left:auto;display:flex;gap:6px}
.ebar .eb{height:29px;padding:0 11px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:500;font-size:12.5px}
.ebar .eb:hover{background:rgba(255,255,255,.2)}
.ebar .eb.on{background:#fff;color:var(--pri);border-color:#fff;font-weight:700}

.cardops{margin-left:auto;display:flex;gap:3px;flex:none;align-items:center}
.cardops button{border:1px solid var(--line);background:#fff;border-radius:5px;height:24px;min-width:24px;padding:0 6px;font-size:11.5px;line-height:1;color:var(--tx2);opacity:.7}
.card:hover .cardops button{opacity:1}
.cardops button:hover{background:#f0f1f3;color:var(--tx)}
.cardops .drag{cursor:grab;font-size:13px;letter-spacing:-1px;color:var(--tx3)}
.cardops .drag:active{cursor:grabbing}
.cardops .ed{color:var(--pri);border-color:#cddfF5;padding:0 9px;font-weight:600}
.cardops .ed:hover{background:var(--pri-w)}
.editbtn{border:1px solid #cddff5;background:#fff;border-radius:5px;height:24px;padding:0 9px;font-size:11.5px;font-weight:600;color:var(--pri)}
.editbtn:hover{background:var(--pri-w)}
.keyedit{margin-left:2px;align-self:center}
body.edit .card:hover{border-color:#c9dbf2}
.card.dragging{opacity:.45}
.card.dropb{box-shadow:0 -3px 0 0 var(--pri)}
.card.dropa{box-shadow:0 3px 0 0 var(--pri)}

/* 서랍 */
.dmask{position:fixed;inset:0;background:rgba(20,22,26,.35);z-index:110;display:none}
.dmask.on{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100%;background:#fff;z-index:111;
  transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;
  box-shadow:-4px 0 30px rgba(20,22,26,.12)
}
.drawer.on{transform:none}
.dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dhead b{font-size:15px;font-weight:700}
.dhead .x{margin-left:auto;border:0;background:none;font-size:17px;color:var(--tx3);line-height:1;padding:4px 6px;border-radius:4px}
.dhead .x:hover{background:#f0f1f3}
.dbody{flex:1;overflow-y:auto;padding:18px 20px}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;background:#f7fafe}
.dfoot .grow{flex:1}

.fld{margin-bottom:16px}
.fld > label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.fld input[type=text],.fld select,.fld textarea{
  width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 11px;outline:none;
  font-size:13.5px;color:var(--tx);background:#fff
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(13,91,212,.13)}
.fld textarea{resize:vertical;line-height:1.6}
.row2{display:flex;gap:10px}
.row2 > .fld{flex:1;min-width:0}
.hint{font-size:11.5px;color:var(--tx3);margin-top:5px}

.dsec{font-size:12px;font-weight:600;color:var(--tx3);margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#f8fbff}
.item .top{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.item .no{font-size:11px;font-weight:600;color:var(--tx3);margin-right:auto}
.item .mb{border:1px solid var(--line);background:#fff;border-radius:5px;width:24px;height:24px;line-height:1;color:var(--tx2);font-size:11.5px}
.item .mb:hover{background:#f0f1f3}
.item .mb.del:hover{background:var(--warn-w);border-color:#f3cdca;color:var(--warn)}
.item .g{display:grid;gap:8px}
.item .g.c2{grid-template-columns:1fr 1fr}
.item input[type=text],.item textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none;font-size:13px;background:#fff}
.item textarea{resize:vertical;min-height:34px;line-height:1.6}
.item input:focus,.item textarea:focus{border-color:var(--pri)}
.item .cap{font-size:11px;color:var(--tx3);margin-bottom:3px;display:block}
.item .memorow{display:flex;gap:6px}
.item .memorow input{flex:1;min-width:0}
.item .memorow select{width:74px;flex:none;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:#fff;font-size:12.5px;color:var(--tx)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.addrow{width:100%;border:1px dashed #d5d8dd;background:#fff;border-radius:8px;padding:10px;color:var(--tx2);font-weight:500;font-size:13px}
.addrow:hover{background:#f2f7fd;border-color:var(--pri);color:var(--pri)}
.dbtn{height:35px;padding:0 15px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--tx2);font-weight:500}
.dbtn:hover{background:#f2f7fd}
.dbtn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.dbtn.pri:hover{background:#0a4bb0}
.dbtn.danger{color:var(--warn);border-color:#f0cfcc}
.dbtn.danger:hover{background:var(--warn-w)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:#fff;padding:11px 19px;border-radius:6px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:200
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:1200px){ .cardops .mv{display:none} }
@media (max-width:1199px){
  .cardops .drag{display:none}
  .hamb{display:block}
  .tnotice{display:none}
  .side{transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 20px rgba(20,22,26,.09)}
  body.nav .side{transform:none}
  body.nav .sideBk{display:block}
  .body{margin-left:0;padding:calc(var(--topH) + var(--barH) + 18px) 16px 60px}
  .brand h1{font-size:14.5px}
  .srch input{width:150px}
  .ggrid{grid-template-columns:1fr;gap:0}
  .gcol{margin-bottom:16px;padding-bottom:4px}
  .tblwrap table.t{min-width:520px}
  .tblwrap table.t.wide{min-width:720px}
  .keys > .key{flex:1;min-width:calc(50% - 5px)}
  .crumb b{font-size:17px}
  .clogo{transform:scale(.9);transform-origin:left center}
}
@media (max-width:760px){
  .ebar{padding:0 12px;gap:7px}
  .ebar .eh,.ebar .demo{display:none}
  .ebar .sp{gap:5px}
  .ebar .eb{padding:0 10px;font-size:12px}
  .drawer{width:100%}
  .dbody{padding:14px}
  .item .g.c2{grid-template-columns:1fr}
  table.rt2 th.k,table.rt2 td.key{min-width:0;padding-right:12px}
  table.rt2 th.k.nw,table.rt2 td.key.nw{white-space:normal}
  table.rt2 th,table.rt2 td{padding:9px 8px}
  table.rt2 tr > *:first-child,table.t tr > *:first-child{padding-left:14px}
  table.rt2 tr > *:last-child,table.t tr > *:last-child{padding-right:14px}
  .card .bd.pad{padding:0 14px 15px}
  .card > h3{padding:13px 14px 10px}
}
@media (max-width:560px){
  .topbar{gap:8px;padding:0 14px}
  .brand h1{font-size:14px;max-width:120px}
  .srch input{width:140px}
}
@media print{
  .topbar,.side,.sideBk,.ebar,.drawer,.dmask,.mask,.editbtn,.cardops,.gtabs{display:none !important}
  .body{margin:0;padding:0;max-width:none}
  body{background:#fff;font-size:11px}
  .card{break-inside:avoid;border-color:#ccc}
  .keys > .key{background:#fff !important;border-color:#bbb}
  .keys > .key .k{color:#666}
  .keys > .key .v{color:#000}
  table.rt2 thead th,table.t thead th{background:#f0f0f0;color:#333}
}

/* ── 접기형 메뉴 (설명문 카드) ── */
.foldbar{display:flex;align-items:center;gap:8px;margin:-2px 0 14px}
.foldbar .fb{
  height:29px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:6px;
  color:var(--tx2);font-size:12.5px;font-weight:500
}
.foldbar .fb:hover{background:#f2f7fd;border-color:#c3d8f2;color:var(--tx)}
.foldbar .fcnt{margin-left:auto;font-size:12px;color:var(--tx3)}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.ai{border-top:1px solid var(--line2)}
.ai:first-child{border-top:0}
.ah{
  display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;
  font-size:14.5px;font-weight:700;color:var(--tx);letter-spacing:-.01em;user-select:none
}
.ah:hover{background:#f7fafe}
.ai.on > .ah{background:#f2f7fe}
.ah:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.ah .chev{flex:none;width:13px;color:#a8b0bd;font-size:12px;line-height:1;transition:transform .15s}
.ai.on > .ah .chev{transform:rotate(90deg);color:var(--pri)}
.ah .at{flex:1;min-width:0;word-break:keep-all;overflow-wrap:break-word}
.ah .tag,.ah .gtag{flex:none}
.ab{display:none;border-top:1px solid var(--line2);background:#fcfdff}
.ai.on > .ab{display:block}
.ab > .bd{padding-top:14px}
.ab > .bd.pad{padding:12px 18px 17px}
.acc .cardops{flex:none;margin-left:6px}
.acc .cardops .drag{display:none}
.acc .cardops .mv{display:inline-block !important}
.acc .cardops button{opacity:1}
@media (max-width:640px){
  .ah{padding:13px 14px;font-size:13.5px}
  .ab > .bd.pad{padding:12px 14px 15px}
}
@media print{
  .ab{display:block !important}
  .ah .chev,.foldbar{display:none !important}
  .ai{break-inside:avoid}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="hamb" id="hamb" aria-label="메뉴">☰</button>
  <div class="brand">
    <h1 id="siteTitle">통신사별 환수규정</h1>
    <span class="tnotice" id="tNotice"></span>
  </div>
  <div class="tools">
    <div class="srch">
      <span class="ic">⌕</span>
      <input id="search" type="search" placeholder="전체 검색 (예: 90일, 재가입, 위면해지)" autocomplete="off">
      <button class="clr" id="clrSearch" title="지우기">×</button>
    </div>
    <button class="btn" id="btnAdmin">관리자</button>
  </div>
</header>

<aside class="side" id="side"></aside>
<div class="sideBk" id="sideBk"></div>

<div class="body">
  <div class="crumb" id="crumb"></div>
  <div id="main"></div>
  <div class="ft">
    <span id="ftNotice"></span>
    <span id="ftUpdated"></span>
  </div>
</div>

<div class="mask" id="loginMask">
  <div class="modal">
    <h4>관리자 로그인</h4>
    <p>내용 수정은 관리자만 가능합니다.</p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <div class="row">
      <button class="btn" id="loginCancel">취소</button>
      <button class="btn pri" id="loginOk">확인</button>
    </div>
  </div>
</div>

<div class="ebar" id="ebar">
  <span class="etag">편집 모드</span>
  <span class="demo" id="edDemo" style="display:none">미리보기 · 저장 안 됨</span>
  <span class="eh" id="edHint"><b>⠿</b> 을 잡고 끌어서 순서 변경 · 편집 중에는 순서 확인을 위해 한 줄로 보입니다</span>
  <div class="sp">
    <button class="eb" id="edAdd">＋ 카드 추가</button>
    <button class="eb" id="edConf">설정</button>
    <button class="eb" id="edExit">나가기</button>
    <button class="eb on" id="edSave">저장</button>
  </div>
</div>

<div class="dmask" id="dmask"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><b id="dTitle">카드 수정</b><button class="x" id="dClose">✕</button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</aside>

<div class="toast" id="toast"></div>

  (DATA['중분류']||[]).forEach(function(r){
    if(r['통신사']===code && r['중분류'] && !seen[r['중분류']]){ seen[r['중분류']]=1; out.push(r['중분류']) }
  });
  ['환수율','정책','기준표'].forEach(function(s){
    (DATA[s]||[]).forEach(function(r){
      if(r['통신사']===code && r['중분류'] && !seen[r['중분류']]){ seen[r['중분류']]=1; out.push(r['중분류']) }
    });
  });
  return out;
}
var GCOLORS=['#0d5bd4','#c2410c','#0b7285','#7048e8','#b06000','#2b8a3e','#ae3ec9'];
function groupsOf(code, sub){
  var out=[], seen={};
  ['환수율','정책','기준표'].forEach(function(sh){
    pick(sh,code,sub).forEach(function(r){
      var g=(r['그룹']||'').trim();
      if(g && !seen[g]){ seen[g]=1; out.push(g) }
    });
  });
  return out;
}
function gColor(code, sub, name){
  var i=groupsOf(code,sub).indexOf(name);
  return GCOLORS[(i<0?0:i)%GCOLORS.length];
}
/* 특정 통신사 + 중분류의 행. 중분류가 빈 행은 공통으로 항상 포함 */
function pick(sheet,code,sub){
  return (DATA[sheet]||[]).filter(function(r){
    if(r['통신사']!==code) return false;
    if(!sub) return true;
    return !r['중분류'] || r['중분류']===sub;
  });
}
function groupBy(rows,key){
  var order=[],map={};
  rows.forEach(function(r){
    var k=(r['그룹']||'')+'\u241F'+(r[key]||'');
    if(!map[k]){map[k]=[];order.push(k)}
    map[k].push(r);
  });
  return order.map(function(k){return {name:k.split('\u241F')[1], grp:k.split('\u241F')[0], rows:map[k]}});
}
/* 설명문 : ■ ● - ※ ① 등 마커를 인식해 계층·들여쓰기 적용 */
function fmtText(raw){
  var lines=String(raw==null?'':raw).replace(/\r/g,'').split('\n');
  var rows=[], seen=[];
  lines.forEach(function(ln){
    if(!ln.trim()){ rows.push(null); return }
    var lead=(ln.match(/^[ \t\u00a0]*/)[0]||'').replace(/\t/g,'  ').length;
    var t=ln.trim(), lv=null, mk='', cls='', m;
    if((m=t.match(/^([■◆★])\s*(.*)$/)))            { lv=0; mk=m[1]; t=m[2]; cls='l0' }
    else if((m=t.match(/^([●○])\s*(.*)$/)))         { lv=1; mk=m[1]; t=m[2]; cls='l1' }
    else if((m=t.match(/^([※])\s*(.*)$/)))          { lv=2; mk=m[1]; t=m[2]; cls='l2 note' }
    else if((m=t.match(/^([→▶])\s*(.*)$/)))         { lv=3; mk=m[1]; t=m[2]; cls='l2 arw' }
    else if((m=t.match(/^([-–—])\s*(.*)$/)))        { lv=2; mk='–'; t=m[2]; cls='l2' }
    else if((m=t.match(/^([·•])\s*(.*)$/)))         { lv=2; mk='·'; t=m[2]; cls='l2' }
    else if((m=t.match(/^([①-⑮])\s*(.*)$/)))        { lv=2; mk=m[1]; t=m[2]; cls='l2' }
    else if((m=t.match(/^(\d{1,2}\))\s*(.*)$/)))   { lv=2; mk=m[1]; t=m[2]; cls='l2' }
    if(lv!==null) seen.push(lv);
    rows.push({lv:lv, mk:mk, t:t, cls:cls||'l3', lead:lead});
  });
  var base = seen.length ? Math.min.apply(null, seen) : 0;
  var out='', last=0;
  rows.forEach(function(r){
    if(!r){ out+='<div class="sp"></div>'; return }
    var lv = r.lv===null ? last : r.lv;
    if(r.lv!==null) last=r.lv;
    /* 단계는 최대 3까지만. 원본 앞 공백은 무시한다 (들여쓰기가 들쭉날쭉해지는 원인) */
    var step = Math.min(3, Math.max(0, lv-base));
    out+='<div class="'+r.cls+'"'+(step?' style="margin-left:calc(var(--mk) * '+step+')"':'')+'>'+
         (r.mk?'<i class="mk">'+esc(r.mk)+'</i>':'')+hl(r.t)+'</div>';
  });
  return out;
}
/* 소제목 : 앞 기호를 마커칸으로 분리해 본문과 같은 눈금에 올린다 */
function fmtHead(raw){
  var t=String(raw==null?'':raw).trim();
  var m=t.match(/^([\u25a0\u25c6\u2605\u25cf\u25cb\u203b\u2192\u25b6\-\u2013\u2014\u00b7\u2022\u2460-\u246e])\s*(.*)$/);
  if(m && m[2]) return {hm:true, h:'<i class="mk">'+esc(m[1])+'</i>'+hl(m[2])};
  return {hm:false, h:hl(t)};
}

function flat(t){
  return String(t==null?'':t).replace(/\r/g,'').split('\n')
    .map(function(x){ return x.replace(/^[ \t\u00a0]+/,'') }).join('\n').trim();
}
function memoCls(v){
  var t=String(v||'').trim();
  if(/빨|red|R/i.test(t)) return ' m-red';
  if(/파|블|blue|B/i.test(t)) return ' m-blue';
  return '';
}
function clean(t){ return String(t==null?'':t).replace(/^\s*[□■☐▪▫·•]\s*/,'').trim() }
function rateCell(v){
  var t=String(v||'').trim();
  var m=t.match(/^(\d+(?:\.\d+)?)\s*%$/);
  if(m){
    var n=parseFloat(m[1]);
    return '<b class="num '+(n>=100?'r3':(n>=50?'r2':'r1'))+'">'+esc(t)+'</b>';
  }
  return '<b class="num txt '+(/전액|100/.test(t)?'r3':'r0')+'">'+hl(t)+'</b>';
}
function cardRates(g,tag,meta){
  var rows=g.rows;
  var blank=function(v){ var t=String(v||'').trim(); return !t || t==='-' || t==='—' };
  var key=function(r){ return blank(r['대상']) ? '' : String(r['대상']).trim() };

  var useKey=rows.some(function(r){ return key(r)!=='' });
  var kMax=0; rows.forEach(function(r){ kMax=Math.max(kMax, key(r).length) });
  var kCls = kMax<=16 ? ' nw' : '';

  var h='<table class="rt2"><thead><tr>'+
        (useKey?'<th class="k'+kCls+'">구분</th>':'')+
        '<th>내용</th><th class="val">환수</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var k=key(r);
    var pk=i>0?key(rows[i-1]):null;
    var nk=i+1<rows.length?key(rows[i+1]):null;
    var same=useKey && k!=='' && k===pk;
    var nextSame=useKey && k!=='' && k===nk;
    h+='<tr>';
    if(useKey) h+='<td class="key'+kCls+(same?' mg':'')+(nextSame?' nb':'')+'">'+(same?'':hl(k))+'</td>';
    h+='<td class="sec">'+(blank(r['구간'])?'<span class="dash">—</span>':hl(clean(r['구간'])));
    if(!blank(r['비고'])) h+='<span class="memo'+memoCls(r['비고색'])+'">'+hl(r['비고'])+'</span>';
    h+='</td><td class="val">'+rateCell(r['환수율'])+'</td></tr>';
  });
  h+='</tbody></table>';
  return card(g.name, h, tag, widthOf(rows,false), 100+rows.length*33, meta, meta&&meta.showGrp?g.grp:'');
}
function cardPolicy(g,tag,meta){
  var h='', len=0, est=70;
  g.rows.forEach(function(r){
    var hi=/^y|^Y|^예|^1/.test(String(r['강조']||''));
    h+='<div class="pol'+(hi?' hi':'')+'">';
    var hasHead=!!(r['소제목']||'').trim();
    if(hasHead){ var hd=fmtHead(r['소제목']); h+='<div class="st'+(hd.hm?' hm':'')+'">'+hd.h+'</div>' }
    if((r['내용']||'').trim())   h+='<div class="ct tx'+(hasHead?' ind':'')+'">'+fmtText(r['내용'])+'</div>';
    h+='</div>';
    var c=String(r['내용']||''), nl=(c.match(/\n/g)||[]).length;
    len+=c.length;
    est+=30+Math.max(nl+1, Math.ceil(c.length/52))*21;
  });
  return card(g.name, h, tag, widthOf(g.rows, len>900), est, meta, meta&&meta.showGrp?g.grp:'');
}
function cardTable(g,tag,meta){
  var rows=g.rows.slice().sort(function(a,b){return (parseFloat(a['순번'])||0)-(parseFloat(b['순번'])||0)});
  var head=rows.filter(function(r){return r['행유형']==='헤더'})[0];
  var body=rows.filter(function(r){return r['행유형']!=='헤더'});
  var cols=['열1','열2','열3','열4','열5'].filter(function(c){
    return (head&&(head[c]||'').trim()) || body.some(function(r){return (r[c]||'').trim()});
  });
  if(!cols.length) cols=['열1','열2'];
  var h='<div class="tblwrap"><table class="t'+(cols.length>2?' wide':'')+'">';
  if(head){ h+='<thead><tr>'; cols.forEach(function(c){h+='<th>'+esc(head[c])+'</th>'}); h+='</tr></thead>' }
  h+='<tbody>';
  var same=body.map(function(r,i){
    return i>0 && String(r[cols[0]]||'').trim()!=='' &&
           String(r[cols[0]]||'')===String(body[i-1][cols[0]]||'');
  });
  body.forEach(function(r,ri){
    h+='<tr>';
    cols.forEach(function(c,i){
      if(i===0){
        var cls='w'+(same[ri]?' mg':'')+((same[ri+1])?' nb':'');
        h+='<td class="'+cls+'">'+(same[ri]?'':hl(flat(r[c])))+'</td>';
      }else{
        h+='<td class="w">'+hl(flat(r[c]))+'</td>';
      }
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  var maxLen=0, est=90;
  body.forEach(function(r){
    var mx=0;
    cols.forEach(function(c){ mx=Math.max(mx, String(r[c]||'').length) });
    maxLen=Math.max(maxLen,mx);
    est+=28+Math.ceil(mx/Math.max(26,Math.floor(66/cols.length)))*20;
  });
  return card(g.name, h, tag, widthOf(g.rows, cols.length>=3 || maxLen>230), est, meta, meta&&meta.showGrp?g.grp:'');
}
/* 배치 열 : '넓게'(전체폭) / '좁게'(2단) / 비우면 자동 */
function widthOf(rows, auto){
  for(var i=0;i<rows.length;i++){
    var v=String(rows[i]['배치']||'').trim();
    if(!v) continue;
    if(/^(넓게|넓|전체|W|w|wide|1)$/.test(v)) return true;
    if(/^(좁게|좁|반|N|n|narrow|2)$/.test(v)) return false;
  }
  return auto;
}
function card(title, inner, tag, wide, est, meta, grp){
  var gb='';
  if(grp){
    var c=gColor(CUR,SUB,grp);
    gb='<span class="gtag" style="color:color-mix(in srgb,'+c+' 80%,#2b3038);background:color-mix(in srgb,'+c+' 15%,#fff)">'+esc(grp)+'</span>';
  }
  var btn='';
  if(EDITMODE && meta){
    CARDS.push(meta);
    var ci=CARDS.length-1;
    btn='<span class="cardops">'+
        (meta.ord?'<button class="drag" data-ci="'+ci+'" title="끌어서 순서 변경">⠿</button>':'')+
        (meta.ord?'<button class="mv" data-mv="-1" data-ci="'+ci+'" title="앞으로">↑</button>':'')+
        (meta.ord?'<button class="mv" data-mv="1" data-ci="'+ci+'" title="뒤로">↓</button>':'')+
        '<button class="ed" data-ci="'+ci+'">✎ 수정</button></span>';
  }
  return {
    wide: !!wide,
    est: est||200,
    h: '<section class="card"'+(meta&&meta.ord&&EDITMODE?' data-ci="'+ci+'"':'')+
       '><h3><span class="dot"></span>'+esc(title)+ gb +
       (tag?'<span class="tag">'+esc(tag)+'</span>':'')+ btn +
       '</h3><div class="bd'+(/^<table|^<div class="tblwrap/.test(inner)?'':' pad')+'">'+inner+'</div></section>'
  };
}

/* ---------- 레이아웃 : 높이 균형 다단 배치 ---------- */
function colCount(){
  return window.innerWidth < 1200 ? 1 : 2;
}
function layout(cards){
  /* 편집 모드에서는 한 줄로 세운다.
     2단 배치는 높이를 맞춰 채우기 때문에 화면 순서와 실제 순서가 달라지고,
     그 상태로 끌어놓으면 엉뚱한 곳에 놓인 것처럼 보인다. */
  var n = EDITMODE ? 1 : colCount();
  if(n===1) return cards.map(function(c){return c.h}).join('');
  var out='', buf=[];
  function flush(){
    if(!buf.length) return;
    if(buf.length===1){ out+=buf[0].h; buf=[]; return }
    var k=Math.min(n,buf.length), cols=[], hs=[];
    for(var i=0;i<k;i++){ cols.push([]); hs.push(0) }
    buf.forEach(function(c){
      var m=0;
      for(var i=1;i<k;i++) if(hs[i]<hs[m]) m=i;
      cols[m].push(c.h); hs[m]+=c.est;
    });
    out+='<div class="grid" style="--n:'+k+'">'+
         cols.map(function(cl){return '<div class="col">'+cl.join('')+'</div>'}).join('')+
         '</div>';
    buf=[];
  }
  cards.forEach(function(c){ if(c.wide){ flush(); out+=c.h } else buf.push(c) });
  flush();
  return out;
}

/* ---------- 본문 ---------- */
function ordOf(rows){
  for(var i=0;i<rows.length;i++){
    var v=parseFloat(rows[i]['정렬']);
    if(!isNaN(v)) return v;
  }
  return 1e9;
}
function buildCards(code, sub, opts){
  opts=opts||{};
  var tag=function(r){ return opts.withTag ? (r['중분류']||'공통') : '' };
  var M=function(sh,g){ return {sheet:sh, rows:g.rows, code:code, showGrp:!!opts.showGrp,
                                ord:true, grp:(g.grp||''), mid:(g.rows[0]['중분류']||'')} };
  function keep(g){
    if(opts.grp===undefined) return true;
    if(opts.grp==='__none__') return !(g.grp||'');
    return (g.grp||'')===opts.grp;
  }
  var items=[];
  groupBy(pick('환수율',code,sub),'구분').filter(keep)
    .forEach(function(g,i){ items.push({k:0,i:i,g:g,fn:cardRates,sh:'환수율'}) });
  groupBy(pick('정책',code,sub).filter(function(r){return r['섹션']!=='핵심 기준'}),'섹션').filter(keep)
    .forEach(function(g,i){ items.push({k:1,i:i,g:g,fn:cardPolicy,sh:'정책'}) });
  groupBy(pick('기준표',code,sub),'표명').filter(keep)
    .forEach(function(g,i){ items.push({k:2,i:i,g:g,fn:cardTable,sh:'기준표'}) });
  items.sort(function(a,b){
    var oa=ordOf(a.g.rows), ob=ordOf(b.g.rows);
    if(oa!==ob) return oa-ob;
    if(a.k!==b.k) return a.k-b.k;
    return a.i-b.i;
  });
  return items.map(function(it){ return it.fn(it.g, tag(it.g.rows[0]), M(it.sh,it.g)) });
}
function matches(html){
  if(!Q) return true;
  return html.replace(/<[^>]*>/g,' ').toLowerCase().indexOf(Q.toLowerCase())>-1;
}

/* ═════════ 접기형 메뉴 ═════════ */
function midRow(code, sub){
  return (DATA['중분류']||[]).filter(function(r){
    return r['통신사']===code && (r['중분류']||'')===(sub||'');
  })[0] || null;
}
function foldOn(code, sub){
  var r=midRow(code, sub);
  return !!(r && /접/.test(String(r['표시']||'')));
}
function fkey(title){ return CUR+'␟'+SUB+'␟'+title }
function foldize(cards){
  if(!cards.length) return '';
  var box=document.createElement('div');
  box.innerHTML=cards.map(function(c){return c.h}).join('');
  var out='', n=0;
  [].slice.call(box.children).forEach(function(sec){
    var h3=sec.querySelector('h3'), bd=sec.querySelector('.bd');
    if(!h3||!bd){ out+=sec.outerHTML; return }
    var ops=h3.querySelector('.cardops');   if(ops) ops.remove();
    var tg =h3.querySelector('.tag');       if(tg)  tg.remove();
    var gtg=h3.querySelector('.gtag');      if(gtg) gtg.remove();
    var dot=h3.querySelector('.dot');       if(dot) dot.remove();
    var title=h3.textContent.trim();
    var k=fkey(title), open=!!FOPEN[k];
    n++;
    out+='<div class="ai'+(open?' on':'')+'">'+
         '<div class="ah" role="button" tabindex="0" aria-expanded="'+(open?'true':'false')+'" data-fk="'+esc(k)+'">'+
           '<span class="chev">›</span>'+
           '<span class="at">'+esc(title)+'</span>'+
           (gtg?gtg.outerHTML:'')+(tg?tg.outerHTML:'')+(ops?ops.outerHTML:'')+
         '</div>'+
         '<div class="ab">'+bd.outerHTML+'</div>'+
         '</div>';
  });
  return {html:'<div class="acc">'+out+'</div>', n:n};
}
function foldBarHTML(keys, n){
  var openCnt=keys.filter(function(k){return FOPEN[k]}).length;
  var allOpen=(n>0 && openCnt>=n);
  return '<div class="foldbar">'+
    '<button class="fb" id="fbAll" data-open="'+(allOpen?'0':'1')+'">'+
      (allOpen?'– 모두 접기':'+ 모두 펼치기')+'</button>'+
    '<span class="fcnt">'+n+'개 항목</span></div>';
}
function foldSection(cards){
  var r=foldize(cards);
  if(!r || !r.n) return '<div class="empty">등록된 내용이 없습니다.</div>';
  var keys=[];
  var box=document.createElement('div'); box.innerHTML=r.html;
  box.querySelectorAll('.ah').forEach(function(a){ keys.push(a.getAttribute('data-fk')) });
  FKEYS=keys;
  return foldBarHTML(keys, r.n)+r.html;
}
var FKEYS=[];
/* 펼침/접힘 상호작용 */
document.getElementById('main').addEventListener('click', function(e){
  if(!e.target.closest) return;
  var fb=e.target.closest('#fbAll');
  if(fb){
    var on=fb.getAttribute('data-open')==='1';
    FKEYS.forEach(function(k){ if(on) FOPEN[k]=true; else delete FOPEN[k] });
    renderBody(); return;
  }
  if(e.target.closest('.cardops')) return;
  var ah=e.target.closest('.ah');
  if(ah){
    var k=ah.getAttribute('data-fk');
    if(FOPEN[k]) delete FOPEN[k]; else FOPEN[k]=true;
    ah.parentNode.classList.toggle('on', !!FOPEN[k]);
    ah.setAttribute('aria-expanded', FOPEN[k]?'true':'false');
    var fbb=document.getElementById('fbAll');
    if(fbb){
      var oc=FKEYS.filter(function(x){return FOPEN[x]}).length;
      var all=(FKEYS.length>0 && oc>=FKEYS.length);
      fbb.setAttribute('data-open', all?'0':'1');
      fbb.textContent = all ? '– 모두 접기' : '+ 모두 펼치기';
    }
  }
}, true);
document.getElementById('main').addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var ah=e.target.closest && e.target.closest('.ah');
  if(!ah) return;
  e.preventDefault(); ah.click();
});

function renderBody(){
  CARDS=[];
  var out='';

  if(Q){
    $('#crumb').innerHTML='<b>검색 결과</b><span class="sep">·</span>\u2018'+esc(Q)+'\u2019';
    var total=0;
    carriers().forEach(function(c){
      var hits=buildCards(c.code,'',{withTag:true, showGrp:true}).filter(function(x){return matches(x.h)});
      if(!hits.length) return;
      total+=hits.length;
      out+='<div class="seclab">'+carrierMini(c.code)+'<span class="cnt">'+hits.length+'건</span></div>'+layout(hits);
    });
    if(!total) out='<div class="empty">\u2018'+esc(Q)+'\u2019 에 대한 검색 결과가 없습니다.</div>';
    $('#main').innerHTML=out;
    return;
  }

  var subs=mids(CUR);
  if(subs.length && subs.indexOf(SUB)<0) SUB=subs[0];
  $('#crumb').innerHTML=carrierHead(CUR)+(SUB?'<span class="sep">\u203A</span>'+esc(SUB):'');

  var keyRows=pick('정책',CUR,SUB).filter(function(r){return r['섹션']==='핵심 기준'});
  if(keyRows.length){
    out+='<div class="keys">';
    keyRows.forEach(function(r){
      out+='<div class="key"><div class="k">'+esc(r['소제목'])+'</div><div class="v">'+esc(r['내용'])+'</div></div>';
    });
    if(EDITMODE){
      CARDS.push({sheet:'정책', rows:keyRows, code:CUR});
      out+='<button class="editbtn keyedit" data-ci="'+(CARDS.length-1)+'">✎ 요약 수정</button>';
    }
    out+='</div>';
  }

  var FOLD=foldOn(CUR,SUB);
  var gs=groupsOf(CUR,SUB);
  if(FOLD && gs.length<2){
    out += foldSection(buildCards(CUR,SUB,{}));
    $('#main').innerHTML=out;
    return;
  }
  if(gs.length>=2){
    var plain=buildCards(CUR,SUB,{grp:'__none__'});
    if(plain.length) out+=layout(plain);
    out+=gtabsHTML(gs);
    if(GRP===''){
      out+='<div class="ggrid" style="--n:'+gs.length+'">';
      gs.forEach(function(g){
        var cs=buildCards(CUR,SUB,{grp:g});
        var inner;
        if(FOLD){ var fr=foldize(cs); inner=(fr&&fr.n)?fr.html:'<div class="empty" style="padding:24px 0">내용 없음</div>' }
        else inner=cs.length?cs.map(function(c){return c.h}).join(''):'<div class="empty" style="padding:24px 0">내용 없음</div>';
        out+='<div class="gcol" style="--gc:'+gColor(CUR,SUB,g)+'">'+gheadHTML(g)+inner+'</div>';
      });
      out+='</div>';
    }else{
      var cs2=buildCards(CUR,SUB,{grp:GRP});
      out+='<div class="gone" style="--gc:'+gColor(CUR,SUB,GRP)+'">'+
           (cs2.length?(FOLD?foldSection(cs2):layout(cs2)):'<div class="empty">내용 없음</div>')+'</div>';
    }
  }else{
    var cards=buildCards(CUR,SUB,{});
    out += cards.length ? layout(cards) : '<div class="empty">등록된 내용이 없습니다.</div>';
  }
  $('#main').innerHTML=out;
}

/* ---------- 데이터 ---------- */
function normalize(raw){
  var out={};
  Object.keys(SHEETS).forEach(function(name){
    var rows=(raw&&raw[name])?raw[name]:[];
    out[name]=rows.map(function(r){
      var o={}; SHEETS[name].forEach(function(h){o[h]=r[h]==null?'':String(r[h])}); return o;
    });
  });
  return out;
}
function load(){
  DATA=normalize(SEED);
  if(!CUR){ CUR=(carriers()[0]||{}).code||''; SUB=mids(CUR)[0]||'' }
  renderAll();
  if(!API_URL) return;
  fetch(API_URL,{method:'GET'}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok) throw new Error(j.error||'불러오기 실패');
    var d=normalize(j.data);
    if(!(d['환수율'].length||d['정책'].length||d['기준표'].length)) return;
    DATA=d;
    var codes=carriers().map(function(c){return c.code});
    if(codes.indexOf(CUR)<0){ CUR=codes[0]||''; SUB=mids(CUR)[0]||''; GRP='' }
    renderAll();
  }).catch(function(e){
    console.warn('시트 연동 실패:',e);
    toast('시트를 불러오지 못해 내장 데이터를 표시합니다.');
  });
}

/* ---------- 데이터 조작 헬퍼 ---------- */
function idxOf(sheet, rows){
  var arr=DATA[sheet];
  return rows.map(function(r){return arr.indexOf(r)}).filter(function(i){return i>=0})
             .sort(function(a,b){return a-b});
}
function addRowTo(sheet, rows, proto){
  var arr=DATA[sheet], idx=idxOf(sheet,rows);
  var at = idx.length ? idx[idx.length-1]+1 : arr.length;
  arr.splice(at,0,proto); rows.push(proto);
  return proto;
}
function delRowFrom(sheet, rows, r){
  var arr=DATA[sheet], i=arr.indexOf(r); if(i>=0) arr.splice(i,1);
  var j=rows.indexOf(r); if(j>=0) rows.splice(j,1);
}
function moveRow(sheet, rows, a, b){
  if(b<0||b>=rows.length) return;
  var arr=DATA[sheet], idx=idxOf(sheet,rows);
  var objs=idx.map(function(i){return arr[i]});
  var t=objs[a]; objs[a]=objs[b]; objs[b]=t;
  idx.forEach(function(i,k){ arr[i]=objs[k] });
  rows.length=0; objs.forEach(function(o){rows.push(o)});
}
function setAll(rows, key, val){ rows.forEach(function(r){ r[key]=val }) }

/* ── 카드 순서 : 종류 상관없이 한 화면 안에서 통합 정렬 ── */
function orderList(meta){
  return CARDS.filter(function(m){
    return m.ord && (m.grp||'')===(meta.grp||'') && (m.mid||'')===(meta.mid||'');
  });
}
function applyOrder(list){
  list.forEach(function(m,i){ m.rows.forEach(function(r){ r['정렬']=String(i+1) }) });
}
function reorderCard(fromCi, toCi, place){
  var a=CARDS[fromCi], b=CARDS[toCi];
  if(!a||!b||!a.ord||!b.ord||a===b) return false;
  if((a.grp||'')!==(b.grp||'')||(a.mid||'')!==(b.mid||'')) return false;
  var list=orderList(a), ia=list.indexOf(a);
  if(ia<0) return false;
  list.splice(ia,1);
  var ib=list.indexOf(b);
  if(ib<0) return false;
  list.splice(place==='before'?ib:ib+1, 0, a);
  applyOrder(list);
  return true;
}
function moveCardBy(ci, dir){
  var a=CARDS[ci]; if(!a||!a.ord) return false;
  var list=orderList(a), i=list.indexOf(a), j=i+dir;
  if(i<0||j<0||j>=list.length) return false;
  return reorderCard(ci, CARDS.indexOf(list[j]), dir<0?'before':'after');
}

function openDrawer(title){
  $('#dTitle').textContent=title;
  $('#drawer').classList.add('on'); $('#dmask').classList.add('on');
}

}

function el2(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e }
function fld(label, node, hint){
  var w=el2('div','fld');
  if(label) w.appendChild(el2('label','',label));
  w.appendChild(node);
  if(hint) w.appendChild(el2('div','hint',hint));
  return w;
}
function textInput(obj, key, ph){
  var e=document.createElement('input'); e.type='text'; e.value=obj[key]||'';
  if(ph) e.placeholder=ph;
  e.addEventListener('input',function(){ obj[key]=e.value });
  return e;
}
function textArea(obj, key, ph, minH){
  var e=document.createElement('textarea'); e.value=obj[key]||''; e.rows=1;
  if(ph) e.placeholder=ph;
  var mh = minH || 76;
  e.style.minHeight=mh+'px'; e.style.overflow='hidden';
  function fit(){ e.style.height='auto'; e.style.height=Math.max(mh, Math.min(e.scrollHeight+2, 300))+'px' }
  e.addEventListener('input',function(){ obj[key]=e.value; fit() });
  setTimeout(fit,0);
  return e;
}
function selectBox(opts, val, onch){
  var s=document.createElement('select');
  opts.forEach(function(o){ s.appendChild(new Option(o[0], o[1])) });
  s.value=val; s.onchange=function(){ onch(s.value) };
  return s;
}
function capWrap(cap, node){
  var d=el2('div');
  d.appendChild(el2('span','cap',cap));
  d.appendChild(node);
  return d;
}

var CARDS=[];

function openCardEditor(meta){
  var sheet=meta.sheet, rows=meta.rows, code=meta.code;
  var titleKey = sheet==='환수율' ? '구분' : (sheet==='정책' ? '섹션' : '표명');
  var isKey = (sheet==='정책' && rows.length && rows[0]['섹션']==='핵심 기준');

  openDrawer(sheet==='기준표' ? '표 수정' : '카드 수정');
  var body=$('#dBody'); body.innerHTML='';

  /* 제목 */
  var tHolder={v:rows.length?rows[0][titleKey]:''};
  var tIn=document.createElement('input'); tIn.type='text'; tIn.value=tHolder.v;
  tIn.addEventListener('input',function(){ setAll(rows,titleKey,tIn.value) });
  body.appendChild(fld(sheet==='기준표'?'표 제목':'카드 제목', tIn,
    isKey ? '‘핵심 기준’ 이라고 두면 화면 맨 위 요약 배지로 표시됩니다.' : ''));

  /* 위치 · 폭 */
  var r2=el2('div','row2');
  var midOpts=[['공통 (모든 메뉴에 표시)','']].concat(mids(code).map(function(m){return [m,m]}));
  var curMid = rows.length ? (rows[0]['중분류']||'') : '';
  r2.appendChild(fld('메뉴 위치', selectBox(midOpts, curMid, function(v){ setAll(rows,'중분류',v) })));
  var curW = rows.length ? (rows[0]['배치']||'') : '';
  r2.appendChild(fld('가로 폭', selectBox([['자동',''],['넓게 (한 줄 전체)','넓게'],['좁게 (2단)','좁게']], curW,
    function(v){ setAll(rows,'배치',v) })));
  body.appendChild(r2);

  /* 소분류(그룹) */
  var gList=groupsOf(code, rows.length?(rows[0]['중분류']||''):SUB);
  var curG = rows.length ? (rows[0]['그룹']||'') : '';
  if(curG && gList.indexOf(curG)<0) gList.push(curG);
  var gwrap=el2('div');
  var gsel=selectBox([['구분 없음','']].concat(gList.map(function(g){return [g,g]})).concat([['＋ 새 구분 만들기…','__new__']]),
    curG, function(v){
      if(v==='__new__'){
        var nv=prompt('새 구분 이름을 입력하세요. (예: SKT, SKB, 유선)','');
        if(nv && nv.trim()){ setAll(rows,'그룹',nv.trim()) } 
        closeDrawer(); renderBody(); return;
      }
      setAll(rows,'그룹',v);
    });
  gwrap.appendChild(gsel);
  body.appendChild(fld('구분 (같은 메뉴 안에서 나누기)', gwrap,
    'SKT / SKB 처럼 한 메뉴 안에서 좌우로 나눠 보고 싶을 때 사용합니다. 비우면 구분 없이 표시됩니다.'));

  if(sheet==='환수율')      buildRateItems(body, rows, sheet);
  else if(sheet==='정책')   buildPolicyItems(body, rows, sheet, isKey);
  else                      buildTableItems(body, rows, sheet);

  /* 하단 버튼 */
  var foot=$('#dFoot'); foot.innerHTML='';
  var del=el2('button','dbtn danger', sheet==='기준표'?'표 삭제':'카드 삭제');
  del.onclick=function(){
    if(!confirm('이 '+(sheet==='기준표'?'표':'카드')+'를 통째로 삭제할까요?')) return;
    rows.slice().forEach(function(r){ delRowFrom(sheet,rows,r) });
    closeDrawer(); renderBody(); toast('삭제했습니다.');
  };
  foot.appendChild(del);
  foot.appendChild(el2('div','grow'));
  var ok=el2('button','dbtn pri','완료');
  ok.onclick=function(){ closeDrawer(); renderBody() };
  foot.appendChild(ok);
}

function itemShell(n, total, onUp, onDown, onDel){
  var box=el2('div','item'), top=el2('div','top');
  top.appendChild(el2('span','no', n+'번'));
  var up=el2('button','mb','↑'); up.title='위로'; up.onclick=onUp;
  var dn=el2('button','mb','↓'); dn.title='아래로'; dn.onclick=onDown;
  var dl=el2('button','mb del','✕'); dl.title='삭제'; dl.onclick=onDel;
  top.appendChild(up); top.appendChild(dn); top.appendChild(dl);
  box.appendChild(top);
  return box;
}

/* 환수율 */
function buildRateItems(body, rows, sheet){
  body.appendChild(el2('div','dsec','구간 목록'));
  var list=el2('div');
  function draw(){
    list.innerHTML='';
    rows.forEach(function(r,i){
      var box=itemShell(i+1, rows.length,
        function(){ moveRow(sheet,rows,i,i-1); draw() },
        function(){ moveRow(sheet,rows,i,i+1); draw() },
        function(){ delRowFrom(sheet,rows,r); draw() });
      var g=el2('div','g c2');
      g.appendChild(capWrap('대상 (상품·유형)', textInput(r,'대상','예) 실사용일수 기준')));
      g.appendChild(capWrap('구간', textInput(r,'구간','예) □ 90일 이하')));
      g.appendChild(capWrap('환수율', textInput(r,'환수율','예) 100%')));
      (function(){
        var box=el2('div'); box.appendChild(el2('span','cap','비고'));
        var row=el2('div','memorow');
        row.appendChild(textInput(r,'비고','비워도 됩니다'));
        row.appendChild(selectBox([['회색',''],['빨강','빨강'],['파랑','파랑']], (function(){
          var v=String(r['비고색']||'').trim();
          return /빨/.test(v)?'빨강':(/파/.test(v)?'파랑':'');
        })(), function(v){ r['비고색']=v }));
        box.appendChild(row); g.appendChild(box);
      })();
      box.appendChild(g); list.appendChild(box);
    });
  }
  draw();
  body.appendChild(list);
  var add=el2('button','addrow','＋ 구간 추가');
  add.onclick=function(){
    var last=rows[rows.length-1]||{};
    addRowTo(sheet,rows,{'통신사':last['통신사']||CUR,'중분류':last['중분류']||'',
      '구분':last['구분']||'','대상':last['대상']||'','구간':'','환수율':'','비고':'','배치':last['배치']||''});
    draw();
  };
  body.appendChild(add);
}

/* 정책 */
function buildPolicyItems(body, rows, sheet, isKey){
  body.appendChild(el2('div','dsec', isKey?'요약 항목':'내용 항목'));
  var list=el2('div');
  function draw(){
    list.innerHTML='';
    rows.forEach(function(r,i){
      var box=itemShell(i+1, rows.length,
        function(){ moveRow(sheet,rows,i,i-1); draw() },
        function(){ moveRow(sheet,rows,i,i+1); draw() },
        function(){ delRowFrom(sheet,rows,r); draw() });
      var g=el2('div','g');
      g.appendChild(capWrap(isKey?'항목명':'소제목 (굵은 글씨 · 비워도 됨)',
        textInput(r,'소제목', isKey?'예) 해지 후 재가입':'')));
      if(isKey){
        g.appendChild(capWrap('값', textInput(r,'내용','예) M+3개월')));
      }else{
        g.appendChild(capWrap('본문', textArea(r,'내용','줄바꿈은 Enter')));
        var lb=el2('label','chk');
        var cb=document.createElement('input'); cb.type='checkbox';
        cb.checked=/^y|^Y|^예|^1/.test(String(r['강조']||''));
        cb.onchange=function(){ r['강조']=cb.checked?'Y':'' };
        lb.appendChild(cb); lb.appendChild(document.createTextNode('빨간 강조 박스로 표시'));
        g.appendChild(lb);
      }
      box.appendChild(g); list.appendChild(box);
    });
  }
  draw();
  body.appendChild(list);
  var add=el2('button','addrow','＋ 항목 추가');
  add.onclick=function(){
    var last=rows[rows.length-1]||{};
    addRowTo(sheet,rows,{'통신사':last['통신사']||CUR,'중분류':last['중분류']||'',
      '섹션':last['섹션']||'','소제목':'','내용':'','강조':'','배치':last['배치']||''});
    draw();
  };
  body.appendChild(add);
}

/* 기준표 */
function buildTableItems(body, rows, sheet){
  var COLS=['열1','열2','열3','열4','열5'];
  function used(){
    var n=2;
    COLS.forEach(function(c,i){ if(rows.some(function(r){return String(r[c]||'').trim()})) n=Math.max(n,i+1) });
    return n;
  }
  var ncol=used();
  var wrap=el2('div');
  function draw(){
    wrap.innerHTML='';
    renumber(rows);
    var head=rows.filter(function(r){return r['행유형']==='헤더'})[0];
    var bodyRows=rows.filter(function(r){return r['행유형']!=='헤더'});

    /* 열 개수 */
    var cbar=el2('div','fld');
    cbar.appendChild(el2('label','','열 개수'));
    var cs=selectBox([['2칸','2'],['3칸','3'],['4칸','4'],['5칸','5']], String(ncol), function(v){
      var nv=parseInt(v,10);
      if(nv<ncol){ for(var i=nv;i<5;i++) setAll(rows,COLS[i],'') }
      ncol=nv; draw();
    });
    cbar.appendChild(cs);
    wrap.appendChild(cbar);

    /* 머리글 */
    wrap.appendChild(el2('div','dsec','표 머리글'));
    if(!head){
      var mk=el2('button','addrow','＋ 머리글 줄 만들기');
      mk.onclick=function(){
        var proto={'통신사':CUR,'중분류':rows.length?rows[0]['중분류']:'','표명':rows.length?rows[0]['표명']:'',
                   '순번':'0','행유형':'헤더','열1':'','열2':'','열3':'','열4':'','열5':'','배치':''};
        DATA[sheet].splice(idxOf(sheet,rows)[0]||DATA[sheet].length,0,proto);
        rows.unshift(proto); draw();
      };
      wrap.appendChild(mk);
    }else{
      var hb=el2('div','item'), hg=el2('div','g c2');
      for(var i=0;i<ncol;i++) hg.appendChild(capWrap((i+1)+'번째 칸', textInput(head,COLS[i],'제목')));
      hb.appendChild(hg); wrap.appendChild(hb);
    }

    /* 본문 */
    wrap.appendChild(el2('div','dsec','표 내용'));
    bodyRows.forEach(function(r,i){
      var gi=rows.indexOf(r);
      var box=itemShell(i+1, bodyRows.length,
        function(){ moveRow(sheet,rows,gi,gi-1); draw() },
        function(){ moveRow(sheet,rows,gi,gi+1); draw() },
        function(){ delRowFrom(sheet,rows,r); draw() });
      var g=el2('div','g'+(ncol>=4?' c2':''));
      for(var k=0;k<ncol;k++){
        var lab=(head && String(head[COLS[k]]||'').trim()) ? head[COLS[k]] : ((k+1)+'번째 칸');
        g.appendChild(capWrap(lab, k===0 ? textInput(r,COLS[k],'') : textArea(r,COLS[k],'',34)));
      }
      box.appendChild(g); wrap.appendChild(box);
    });
    var add=el2('button','addrow','＋ 줄 추가');
    add.onclick=function(){
      var last=rows[rows.length-1]||{};
      addRowTo(sheet,rows,{'통신사':last['통신사']||CUR,'중분류':last['중분류']||'','표명':last['표명']||'',
        '순번':'','행유형':'본문','열1':'','열2':'','열3':'','열4':'','열5':'','배치':last['배치']||''});
      draw();
    };
    wrap.appendChild(add);
  }
  draw();
  body.appendChild(wrap);
}

    ['환수율 표  (구간 → 환수율)','환수율'],
    ['안내 카드  (제목 + 설명 글)','정책'],
    ['기준표  (여러 칸으로 된 표)','기준표']
  ], st.kind, function(v){ st.kind=v }), '나중에 바꿀 수 없으니 형태만 골라주세요.'));

  var midOpts=[['공통 (모든 메뉴에 표시)','']].concat(mids(CUR).map(function(m){return [m,m]}));
  body.appendChild(fld('어느 메뉴에 넣을까요?', selectBox(midOpts, st.mid, function(v){ st.mid=v }),

  var ti=document.createElement('input'); ti.type='text'; ti.placeholder='예) 해지, 유심 환수기준, 소명 인정 케이스';
  ti.addEventListener('input',function(){ st.title=ti.value });
  body.appendChild(fld('제목', ti));

  var foot=$('#dFoot'); foot.innerHTML='';
  var c=el2('button','dbtn','취소'); c.onclick=function(){ closeDrawer() };
  foot.appendChild(c); foot.appendChild(el2('div','grow'));
  var mk=el2('button','dbtn pri','만들기');
  mk.onclick=function(){
    if(!st.title.trim()){ alert('제목을 입력해주세요.'); ti.focus(); return }
    var sheet=st.kind, rows=[], proto;
    if(sheet==='환수율'){
      proto={'통신사':CUR,'중분류':st.mid,'구분':st.title,'대상':'','구간':'','환수율':'','비고':'','배치':''};
    }else if(sheet==='정책'){
      proto={'통신사':CUR,'중분류':st.mid,'섹션':st.title,'소제목':'','내용':'','강조':'','배치':''};
    }else{
      proto={'통신사':CUR,'중분류':st.mid,'표명':st.title,'순번':'1','행유형':'헤더',
             '열1':'','열2':'','열3':'','열4':'','열5':'','배치':''};
    }
    DATA[sheet].push(proto); rows.push(proto);
    if(sheet==='기준표'){
      var b2={'통신사':CUR,'중분류':st.mid,'표명':st.title,'순번':'2','행유형':'본문',
              '열1':'','열2':'','열3':'','열4':'','열5':'','배치':''};
      DATA[sheet].push(b2); rows.push(b2);
    }
    if(st.mid) SUB=st.mid;
    renderSide();
    openCardEditor({sheet:sheet, rows:rows, code:CUR});
  };
  foot.appendChild(mk);
};

/* ---------- 설정 ---------- */
$('#edConf').onclick=function(){
  openDrawer('설정');
  var body=$('#dBody'); body.innerHTML='';
  function confRow(key, label, area, ph){
    var r=(DATA['설정']||[]).filter(function(x){return x['키']===key})[0];
    if(!r){ r={'키':key,'값':''}; DATA['설정'].push(r) }
    body.appendChild(fld(label, area?textArea(r,'값',ph):textInput(r,'값',ph)));
  }
  confRow('제목','대시보드 제목');
  var r2=el2('div','row2');
  (function(){
    var a=(DATA['설정']||[]).filter(function(x){return x['키']==='기준일'})[0]||{'키':'기준일','값':''};
    var b=(DATA['설정']||[]).filter(function(x){return x['키']==='버전'})[0]||{'키':'버전','값':''};
    if(DATA['설정'].indexOf(a)<0) DATA['설정'].push(a);
    if(DATA['설정'].indexOf(b)<0) DATA['설정'].push(b);
    r2.appendChild(fld('기준일', textInput(a,'값','예) 2026년 07월')));
    r2.appendChild(fld('버전', textInput(b,'값','예) 2607.ver')));
  })();
  body.appendChild(r2);
  confRow('공지','상단 공지 문구', true);

  body.appendChild(el2('div','dsec', cName(CUR)+' 메뉴 관리'));
  var list=el2('div');
  function drawMids(){
    list.innerHTML='';
    var rows=(DATA['중분류']||[]).filter(function(r){return r['통신사']===CUR});
    rows.forEach(function(r,i){
      var box=itemShell(i+1, rows.length,
        function(){ moveRow('중분류',rows,i,i-1); drawMids() },
        function(){ moveRow('중분류',rows,i,i+1); drawMids() },
        function(){
          if(!confirm('메뉴 ‘'+r['중분류']+'’ 를 목록에서 뺄까요?\n(카드 내용은 지워지지 않습니다)')) return;
          delRowFrom('중분류',rows,r); drawMids(); renderSide();
        });
      var inp=textInput(r,'중분류','메뉴 이름');
      inp.addEventListener('change',function(){ renderSide() });
      box.appendChild(inp);
      var mrow=el2('div','row2');
      mrow.appendChild(fld('보기 방식', selectBox(
        [['카드형 (내용 펼쳐서 표시)',''],['접기형 (제목만 보이고 눌러서 펼치기)','접기']],
        (/접/.test(String(r['표시']||''))?'접기':''),
        function(v){ r['표시']=v; renderBody() })));
      mrow.appendChild(el2('div'));
      box.appendChild(mrow);
      list.appendChild(box);
    });
  }
  drawMids();
  body.appendChild(list);
  var addm=el2('button','addrow','＋ 메뉴 추가');
  addm.onclick=function(){
    DATA['중분류'].push({'통신사':CUR,'중분류':'','표시':''});
    drawMids(); renderSide();
  };
  body.appendChild(addm);

  var foot=$('#dFoot'); foot.innerHTML='';
  foot.appendChild(el2('div','grow'));
  var ok=el2('button','dbtn pri','완료');
  ok.onclick=function(){ closeDrawer(); renderAll() };
  foot.appendChild(ok);
};

/* ---------- 카드 수정 버튼 ---------- */
document.getElementById('main').addEventListener('click', function(e){
  if(!e.target.closest) return;
  var t=e.target.closest('.gt2');
  if(t){ GRP=t.getAttribute('data-g')||''; renderBody(); window.scrollTo({top:0,behavior:'smooth'}); return }
  var mv=e.target.closest('.cardops button[data-mv]');
  if(mv){
    if(moveCardBy(parseInt(mv.getAttribute('data-ci'),10), parseInt(mv.getAttribute('data-mv'),10))) renderBody();
    else toast('더 이상 옮길 수 없습니다.');
    return;
  }
  var b=e.target.closest('.cardops .ed') || e.target.closest('.editbtn');
  if(!b) return;
  var m=CARDS[parseInt(b.getAttribute('data-ci'),10)];
  if(m) openCardEditor(m);
});

/* ---------- 드래그로 카드 순서 변경 ---------- */
(function(){
  var main=document.getElementById('main'), src=null;
  function clearMark(){
    main.querySelectorAll('.dropb,.dropa').forEach(function(x){ x.classList.remove('dropb','dropa') });
  }
  main.addEventListener('mousedown', function(e){
    var h=e.target.closest && e.target.closest('.cardops .drag');
    if(!h) return;
    var c=h.closest('.card'); if(c) c.setAttribute('draggable','true');
  });
  main.addEventListener('dragstart', function(e){
    var c=e.target.closest && e.target.closest('.card[draggable="true"]');
    if(!c){ e.preventDefault(); return }
    src=c; c.classList.add('dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', c.getAttribute('data-ci')||'') }catch(x){}
  });
  main.addEventListener('dragover', function(e){
    if(!src) return;
    var c=e.target.closest && e.target.closest('.card[data-ci]');
    if(!c || c===src) return;
    e.preventDefault();
    var a=CARDS[parseInt(src.getAttribute('data-ci'),10)], b=CARDS[parseInt(c.getAttribute('data-ci'),10)];
    if(!a||!b||(a.grp||'')!==(b.grp||'')||(a.mid||'')!==(b.mid||'')) return;
    var r=c.getBoundingClientRect(), before=(e.clientY - r.top) < r.height/2;
    clearMark(); c.classList.add(before?'dropb':'dropa');
  });
  main.addEventListener('dragleave', function(e){
    var c=e.target.closest && e.target.closest('.card[data-ci]');
    if(c) c.classList.remove('dropb','dropa');
  });
  main.addEventListener('drop', function(e){
    if(!src) return;
    e.preventDefault();
    var c=e.target.closest && e.target.closest('.card[data-ci]');
    clearMark();
    if(c && c!==src){
      var r=c.getBoundingClientRect(), before=(e.clientY - r.top) < r.height/2;
      if(reorderCard(parseInt(src.getAttribute('data-ci'),10), parseInt(c.getAttribute('data-ci'),10), before?'before':'after')){
        src=null; renderBody(); return;
      }
    }
    src.classList.remove('dragging'); src.removeAttribute('draggable'); src=null;
  });
  main.addEventListener('dragend', function(){
    clearMark();
    if(src){ src.classList.remove('dragging'); src.removeAttribute('draggable') }
    src=null;
  });
})();

document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if($('#loginMask').classList.contains('on')) $('#loginMask').classList.remove('on');
  else if($('#drawer').classList.contains('on')){ closeDrawer(); renderBody() }
});

window.addEventListener('resize',function(){
  clearTimeout(window._rz);
  window._rz=setTimeout(function(){
    var n=colCount();
    if(n!==_cols){ _cols=n; renderBody() }
  },160);
});
